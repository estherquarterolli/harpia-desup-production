<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  {% for field in form %}
  <div class="min-w-0 {% if field.name == 'observacoes' or field.name == 'justificativa_administrativa' or field.name == 'nome' or field.field.widget.input_type == 'checkbox' %}sm:col-span-2{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
      <span class="mt-0.5">{{ field }}</span>
      <span>
        <span class="block text-sm font-bold text-slate-700">{{ field.label }}</span>
        {% if field.help_text %}<span class="mt-1 block text-xs text-slate-500">{{ field.help_text }}</span>{% endif %}
      </span>
    </label>
    {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-bold text-slate-700">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
    {% endif %}
  </div>
  {% endfor %}
</div>
