<div id="atalhos-bloco">
    <div class="flex flex-wrap items-center gap-3">
        {% for atalho in atalhos_user %}
        <div class="inline-flex items-center rounded-xl bg-[#025c9f] text-white shadow-sm overflow-hidden">
            <a href="{{ atalho.href }}"
               class="inline-flex items-center gap-2 px-4 py-3 text-sm font-black transition-colors hover:bg-[#153e70]">
                <i class="ph {{ atalho.icon }} text-lg"></i>
                {{ atalho.label }}
            </a>
            <form method="post" action="{% url 'core:atalho_remove' atalho.id %}" class="flex"
                  hx-post="{% url 'core:atalho_remove' atalho.id %}" hx-target="#atalhos-bloco" hx-swap="outerHTML">
                {% csrf_token %}
                <button type="submit" title="Remover atalho"
                        class="px-2.5 py-3 text-white/70 hover:text-white hover:bg-[#153e70] transition-colors">
                    <i class="ph ph-x"></i>
                </button>
            </form>
        </div>
        {% endfor %}

        <button type="button" onclick="abrirAdicionarAtalho()"
                class="inline-flex items-center gap-2 rounded-xl bg-slate-100 px-4 py-3 text-sm font-bold text-slate-600 border border-slate-200 shadow-sm transition-colors hover:bg-slate-200">
            <i class="ph ph-plus-circle"></i>
            Adicionar atalho
        </button>
    </div>

    <div id="modalAddAtalho" class="hidden fixed inset-0 z-[140] flex items-center justify-center p-4 bg-black/40">
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 class="text-base font-black text-[#025c9f]">Adicionar atalhos</h3>
                <button type="button" onclick="fecharModal('modalAddAtalho')" class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <form method="post" action="{% url 'core:atalho_add' %}"
                  hx-post="{% url 'core:atalho_add' %}" hx-target="#atalhos-bloco" hx-swap="outerHTML">
                {% csrf_token %}
                <div class="px-6 py-4 max-h-[55vh] overflow-y-auto">
                    <p class="text-xs font-semibold text-slate-500 mb-3">Selecione uma ou mais páginas/ações:</p>
                    {% for op in atalhos_disponiveis %}
                    <label class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox" name="chave" value="{{ op.chave }}"
                               class="rounded text-[#025c9f] focus:ring-[#025c9f]">
                        <span class="text-sm font-semibold text-slate-700">{{ op.label }}</span>
                    </label>
                    {% empty %}
                    <p class="text-sm text-slate-400 py-6 text-center font-semibold">Todos os atalhos já foram adicionados.</p>
                    {% endfor %}
                </div>
                <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50/50">
                    <button type="button" onclick="fecharModal('modalAddAtalho')"
                            class="px-4 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-100 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="bg-[#025c9f] hover:bg-[#153e70] text-white px-5 py-2.5 rounded-lg text-sm font-black transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        function abrirAdicionarAtalho() { abrirModal('modalAddAtalho'); }
        document.querySelectorAll('#modalAddAtalho').forEach(function (modal) {
            modal.addEventListener('click', function (event) {
                if (event.target === modal) modal.classList.add('hidden');
            });
        });
    </script>
</div>
