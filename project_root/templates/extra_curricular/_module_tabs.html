{% firstof semestre semestre_corrente as nav_semestre %}
<div class="extra-tabs-bar">
<nav class="extra-tabs" aria-label="Seções de alocação extracurricular">
  <div class="extra-tab-card extra-tab-blue {% if aba_ativa == 'pendencias' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'pendencias' %}aria-current="page"{% endif %}>
      <i class="ph ph-clipboard-text extra-tab-icon" aria-hidden="true"></i>
      <span>Pendências</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-amber {% if aba_ativa == 'rascunhos' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?aba=rascunhos&amp;semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'rascunhos' %}aria-current="page"{% endif %}>
      <i class="ph ph-pencil-simple-line extra-tab-icon" aria-hidden="true"></i>
      <span>Rascunhos</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-violet {% if aba_ativa == 'tcc' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?aba=tcc&amp;semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'tcc' %}aria-current="page"{% endif %}>
      <i class="ph ph-graduation-cap extra-tab-icon" aria-hidden="true"></i>
      <span>Orientação de TCC</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-rose {% if aba_ativa == 'extensao' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?aba=extensao&amp;semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'extensao' %}aria-current="page"{% endif %}>
      <i class="ph ph-users-three extra-tab-icon" aria-hidden="true"></i>
      <span>Extensão</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-cyan {% if aba_ativa == 'reducao' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?aba=reducao&amp;semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'reducao' %}aria-current="page"{% endif %}>
      <i class="ph ph-arrow-line-down extra-tab-icon" aria-hidden="true"></i>
      <span>Redução de CH</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-indigo {% if aba_ativa == 'licenca' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:pendencia_list' %}?aba=licenca&amp;semestre={{ nav_semestre|urlencode }}{% if unidade_selecionada %}&amp;unidade_id={{ unidade_selecionada.pk }}{% endif %}"
       class="extra-tab-link" {% if aba_ativa == 'licenca' %}aria-current="page"{% endif %}>
      <i class="ph ph-airplane-tilt extra-tab-icon" aria-hidden="true"></i>
      <span>Licença</span>
    </a>
  </div>
  <div class="extra-tab-card extra-tab-emerald {% if aba_ativa == 'supervisao' %}is-active{% endif %}">
    <a href="{% url 'extra_curricular:supervisao_estagio' %}{% if unidade_selecionada %}?unidade_id={{ unidade_selecionada.pk }}{% endif %}" class="extra-tab-link" {% if aba_ativa == 'supervisao' %}aria-current="page"{% endif %}>
      <i class="ph ph-student extra-tab-icon" aria-hidden="true"></i>
      <span>Supervisão de Estágio</span>
    </a>
  </div>
</nav>
</div>
