<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro interno — Harpia DESUP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 text-center">
    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
    </div>
    <h1 class="text-xl font-black text-slate-800 mb-2">Ocorreu um problema</h1>
    <p class="text-sm text-slate-500 mb-6 leading-relaxed">
      Ocorreu um erro inesperado e não foi possível processar sua solicitação.<br>
      Por favor, tente novamente em alguns instantes. Se o problema persistir, entre em contato com o suporte.
    </p>
    <a href="/"
       class="inline-flex items-center gap-2 bg-[#025c9f] hover:bg-[#153e70] text-white font-bold text-sm px-6 py-2.5 rounded-xl transition-colors">
      Voltar ao início
    </a>
  </div>
</body>
</html>
