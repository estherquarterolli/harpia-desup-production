{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpia - Confirmar E-mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page min-h-screen flex flex-col font-sans text-slate-800 bg-pattern">
    <main class="login-main flex-grow flex items-center justify-center p-4 sm:p-6">
        <section class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 sm:p-10">
            <header class="login-brand flex flex-col items-center">
                <div class="login-brand-mark flex flex-col items-center justify-center">
                    <img src="{% static 'img/logo-harpia-colorida-modificada.PNG' %}" alt="Logo Harpia" class="w-48 h-auto object-contain transition-transform hover:scale-110">
                </div>
            </header>

            <form method="POST" id="email-confirm-form" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="email" id="email-confirm-input">

                <p class="text-xs text-slate-500 mb-4 leading-normal">
                    Para alterar sua senha, confirme o e-mail da sua conta. Enviaremos um link seguro para concluir a troca.
                </p>

                {% if success %}
                    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-md">
                        <p class="text-xs text-emerald-700 font-semibold text-center">{{ success }}</p>
                    </div>
                {% elif error %}
                    <div class="p-3 bg-red-50 border border-red-200 rounded-md">
                        <p class="text-xs text-red-600 font-semibold text-center">{{ error }}</p>
                    </div>
                    <button type="button" id="open-email-prompt" class="w-full bg-[#025c9f] hover:bg-[#153e70] text-white font-semibold py-3 rounded-lg text-sm transition-colors shadow-md flex justify-center items-center gap-2 mt-6 uppercase tracking-wider">
                        Informar E-mail
                    </button>
                {% else %}
                    <button type="button" id="open-email-prompt" class="w-full bg-[#025c9f] hover:bg-[#153e70] text-white font-semibold py-3 rounded-lg text-sm transition-colors shadow-md flex justify-center items-center gap-2 mt-6 uppercase tracking-wider">
                        Informar E-mail
                    </button>
                {% endif %}

                <div class="text-center mt-5">
                    <a href="{% url 'dashboard' %}" class="text-xs font-bold text-[#025c9f] hover:underline transition-all">
                        Voltar
                    </a>
                </div>
            </form>
        </section>
    </main>

    <footer class="login-footer bg-[#1e293b] text-white px-6 py-4 flex items-center justify-between shadow-inner mt-auto">
        <div class="text-xs sm:text-sm font-semibold tracking-wide">
            ©2026 HARPIA
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) {
                lucide.createIcons();
            }

            const button = document.getElementById('open-email-prompt');
            const form = document.getElementById('email-confirm-form');
            const input = document.getElementById('email-confirm-input');

            function openPrompt() {
                Swal.fire({
                    title: 'Confirme seu e-mail',
                    input: 'email',
                    inputLabel: 'E-mail da sua conta',
                    inputPlaceholder: 'email@faetec.rj.gov.br',
                    confirmButtonText: 'Enviar link',
                    cancelButtonText: 'Cancelar',
                    showCancelButton: true,
                    confirmButtonColor: '#025c9f',
                    inputValidator: function(value) {
                        if (!value) {
                            return 'Informe seu e-mail.';
                        }
                        return null;
                    }
                }).then(function(result) {
                    if (result.isConfirmed) {
                        input.value = result.value;
                        form.submit();
                    }
                });
            }

            if (button) {
                button.addEventListener('click', openPrompt);
                openPrompt();
            }
        });
    </script>
</body>
</html>
