{% load i18n %}
<div class="theme-switcher" aria-label="{% trans 'Theme selector' %}">
  <button type="button" data-HARPIA-theme-toggle="light" aria-pressed="false">
    <i class="ph ph-sun"></i>
    <span>{% trans 'Light' %}</span>
  </button>
  <button type="button" data-HARPIA-theme-toggle="dark" aria-pressed="false">
    <i class="ph ph-moon-stars"></i>
    <span>{% trans 'Dark' %}</span>
  </button>
</div>
