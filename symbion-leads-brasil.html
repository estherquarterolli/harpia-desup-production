<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symbion Leads Brasil</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#111827;--brandfg:#fff;--wa:#16a34a;--red:#dc2626;--blue:#2563eb;--warn:#b45309;--tint-sent:#eff6ff;--tint-reply:#fefce8;--tint-won:#f0fdf4;--tint-no:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--fg:#e2e8f0;--mut:#94a3b8;--line:#243049;--brand:#e2e8f0;--brandfg:#0f172a;--warn:#fbbf24;--tint-sent:#10213f;--tint-reply:#2a2410;--tint-won:#0f2a1a;--tint-no:#18212f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{margin:0;font-size:17px;flex:1 1 160px}
.stats{display:flex;gap:14px;color:var(--mut);font-size:13px;flex-wrap:wrap}.stats b{color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select,textarea,button{font:inherit;color:var(--fg)}
input[type=text],input[type=search],input[type=email],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filters input[type=search]{flex:1 1 200px;min-width:160px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
button.p{background:var(--brand);color:var(--brandfg);border-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.card.s-wa,.card.s-mail,.card.s-both{background:var(--tint-sent)}.card.s-reply{background:var(--tint-reply)}.card.s-won{background:var(--tint-won)}.card.s-no{background:var(--tint-no);opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.title{font-size:15px;font-weight:650}
.meta{color:var(--mut);font-size:13px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.nosite{background:#fef3c7;color:#92400e;border-color:#fde68a}.chip.social{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}.chip.site{background:#f1f5f9;color:#334155}
.chip.warn{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-block;border:0;border-radius:8px;padding:7px 12px;color:#fff;text-decoration:none;font-weight:600;cursor:pointer}
.btn.wa{background:var(--wa)}.btn.g{background:var(--red)}.btn.o{background:var(--blue)}.btn.c{background:var(--brand);color:var(--brandfg)}.btn.l{background:#64748b}
.btn[aria-disabled=true]{opacity:.35;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:3px;font-size:12px;color:var(--mut)}
details summary{cursor:pointer;color:var(--mut);font-size:12px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,monospace;margin:6px 0 0}
.empty{text-align:center;color:var(--mut);padding:40px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:520px;width:92vw;padding:18px}
dialog::backdrop{background:#0008}
dialog form{display:grid;gap:10px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--brand);color:var(--brandfg);padding:8px 14px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Symbion Leads Brasil</h1>
    <div class="stats"><span><b id="sTotal">0</b> leads</span><span><b id="sSent">0</b> enviados</span><span><b id="sReply">0</b> responderam</span><span><b id="sWon">0</b> fechados</span></div>
    <button class="p" id="bAdd">+ Adicionar lead</button>
    <button id="bExport">Exportar CSV</button>
    <button id="bBackup">Backup</button>
    <button id="bRestore">Restaurar</button>
    <button id="bSettings">Assinatura</button>
    <input type="file" id="fRestore" accept=".json" hidden>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Buscar empresa, cidade, nicho...">
    <select id="fCountry"><option value="">Todos os países</option></select>
    <select id="fSeg"><option value="">Todos os segmentos</option></select>
    <select id="fSignal"><option value="">Qualquer site</option><option value="none">Sem site</option><option value="social">Só rede social / grátis</option><option value="site">Com site próprio</option></select>
    <select id="fChannel"><option value="">Qualquer canal</option><option value="mail">Tem e-mail</option><option value="nomail">Sem e-mail ainda</option></select>
    <select id="fStatus"><option value="">Todos os estados</option></select>
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast"></div>

<dialog id="dAdd">
  <form method="dialog" id="fAdd">
    <h3 style="margin:0">Adicionar lead</h3>
    <label class="f">Empresa *<input type="text" id="aCompany" required></label>
    <div class="grid2">
      <label class="f">Segmento<select id="aSeg"><option value="escola">Escola</option><option value="advogado">Advogado</option><option value="contador">Contabilidade</option><option value="dentista">Dentista</option><option value="autoescola">Autoescola</option><option value="outro" selected>Outro</option></select></label>
      <label class="f">Nicho<input type="text" id="aNiche" placeholder="ex.: psicólogo"></label>
      <label class="f">Cidade<input type="text" id="aCity"></label>
      <label class="f">País<input type="text" id="aCountry"></label>
      <label class="f">Idioma da mensagem<select id="aLang"><option value="pt" selected>Português</option><option value="es">Español</option><option value="it">Italiano</option><option value="en">English</option></select></label>
      <label class="f">WhatsApp (com 55 + DDD, só números)<input type="text" id="aWa" placeholder="5521999999999"></label>
      <label class="f">E-mail<input type="email" id="aEmail"></label>
      <label class="f">Site<input type="text" id="aSite" placeholder="https://..."></label>
      <label class="f">Situação do site<select id="aSignal"><option value="none">Sem site</option><option value="social">Só rede social</option><option value="facebook">Só Facebook</option><option value="instagram">Só Instagram</option><option value="linktree">Só Linktree</option><option value="free">Site gratuito</option><option value="site">Tem site próprio</option></select></label>
    </div>
    <div id="aWarn" class="chip warn" hidden></div>
    <div class="row" style="justify-content:flex-end"><button type="button" id="aCancel">Cancelar</button><button class="p" type="submit">Adicionar</button></div>
  </form>
</dialog>

<dialog id="dSet">
  <form method="dialog" id="fSet">
    <h3 style="margin:0">Assinatura</h3>
    <label class="f">Nome<input type="text" id="sName"></label>
    <label class="f">Empresa<input type="text" id="sCompany"></label>
    <label class="f">Site (sem /pt, /en ou /es no final)<input type="text" id="sSite"></label>
    <label class="f">Endereço postal (opcional; recomendado em e-mails para os EUA)<input type="text" id="sAddr"></label>
    <div class="row" style="justify-content:flex-end"><button type="button" id="sCancel">Cancelar</button><button class="p" type="submit">Salvar</button></div>
  </form>
</dialog>

const SIGLABEL = {social:'só rede social',none:'sem site',facebook:'só Facebook',instagram:'só Instagram',linktree:'só Linktree',free:'site gratuito',site:'tem site próprio'};

/* ---------- storage (à prova de falhas) ---------- */
let db = {settings:{name:'Esther Quarterolli',company:'Symbion Labs',site:'https://symbionlab.com.br',addr:''},state:{},custom:[]};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); db={...db,...p,settings:{...db.settings,...(p.settings||{})}};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Não consegui salvar neste navegador. Use "Backup".');}}
const st = id => (db.state[id] ||= {status:'new',note:'',email:'',lang:''});
const all = () => LEADS.concat(db.custom);

/* ---------- utilidades ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const digits = s => String(s||'').replace(/\D/g,'');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
const mapsOf = l => l.maps || ('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((l.company+' '+(l.city||'')).trim()));
const langOf = l => st(l.id).lang || l.lang;
const emailOf = l => (st(l.id).email || l.email || '').trim();
const socialSig = s => ['facebook','instagram','linktree','free','social'].includes(s);
function wasSent(l){return (l.wa && SENT.phones.includes(digits(l.wa))) || (emailOf(l) && SENT.emails.includes(emailOf(l).toLowerCase()));}

/* ---------- segmentos (Brasil) ---------- */
const SEG={
 escola:{label:'Escola',plural:'escolas',offer:'um rascunho de uma página para a escola (com informações de matrícula e contato)'},
 advogado:{label:'Advogado',plural:'escritórios de advocacia',offer:'um rascunho de um site institucional sóbrio para o escritório, com atenção às regras de publicidade da OAB'},

};
const SEGLABEL = l => (SEG[l.segment]||{}).label || '';
function placeOf(l){const p=(l.city||'').split(' - ');return (p.length>1&&p[1].trim().length===2)?p[0].trim():p[p.length-1].trim();}
function segParts(l){
  const g=SEG[l.segment]||SEG.outro, c=l.company, place=placeOf(l), first=(db.settings.name||'').split(' ')[0]||'';
  const obs = l.signal==='none' ? `Pesquisei ${g.plural} em ${place} no Google e não encontrei um site de ${c}.`
            : `Vi que ${c} divulga o trabalho no ${l.detail||'redes sociais'}, mas não encontrei um site próprio.`;
  const rate = (l.rating!==''&&l.rating!=null&&Number(l.rating)>=4&&Number(l.reviews)>=5) ? ` Vi também a nota ${Number(l.rating).toFixed(1).replace('.',',')} com ${l.reviews} avaliações: uma ótima reputação que poderia aparecer mais para quem pesquisa.` : '';
  const offer = `Posso montar, sem custo e sem compromisso, ${g.offer}, para você ver como ficaria. Posso enviar?`;
  const out = `(Se não tiver interesse, é só dizer "não" e eu não escrevo mais.)`;
  return {first,obs,rate,offer,out,c};
}
function segWA(l){if(l.segment==='escola')return escolaWA(l);const p=segParts(l);
  return `Olá, tudo bem?\n\nMeu nome é ${p.first}, sou da ${db.settings.company}, empresa brasileira de criação de sites.\n\n${p.obs}${p.rate}\n\n${p.offer}\n\n${p.out}\n\n${sig('pt')}`;}
function segMail(l){if(l.segment==='escola')return escolaMail(l);const p=segParts(l);
  return {subject:`Rascunho gratuito de site para ${l.company}`,
          body:`Olá,\n\nMeu nome é ${p.first}, sou da ${db.settings.company}, empresa brasileira de criação de sites.\n\n${p.obs}${p.rate}\n\n${p.offer}\n\n${p.out.replace('dizer "não"','responder "não"')}\n\n${sig('pt')}`};}

/* ---------- escolas: gancho de matrículas ---------- */
function anoLetivo(){const d=new Date();return d.getMonth()>=6?d.getFullYear()+1:d.getFullYear();}
function escolaParts(l){
  const place=placeOf(l), c=l.company, first=(db.settings.name||'').split(' ')[0]||'', ano=anoLetivo();
  const obs = l.signal==='none' ? `Pesquisei escolas em ${place} no Google e não encontrei um site de ${c}.`
            : `Vi que ${c} divulga o trabalho no ${l.detail||'redes sociais'}, mas não encontrei um site próprio.`;
  const rate = (l.rating!==''&&l.rating!=null&&Number(l.rating)>=4&&Number(l.reviews)>=5) ? ` Vi também a nota ${Number(l.rating).toFixed(1).replace('.',',')} com ${l.reviews} avaliações: uma ótima reputação que merece ser vista por mais famílias.` : '';
  const why = `Hoje muitos pais pesquisam na internet antes de escolher onde matricular os filhos, e estamos justamente na época de matrículas para ${ano}.`;
  const offer = `Posso montar, sem custo e sem compromisso, um rascunho de uma página para a escola (com turmas, informações de matrícula e botão de WhatsApp) para você ver como ficaria. Posso enviar?`;
  const out = `(Se não tiver interesse, é só dizer "não" e eu não escrevo mais.)`;
  return {place,c,first,ano,obs,rate,why,offer,out};
}
function escolaWA(l){const p=escolaParts(l);
  return `Olá, tudo bem? 😊\n\nMeu nome é ${p.first}, sou da ${db.settings.company}, empresa brasileira de criação de sites.\n\n📢 *Não perca a oportunidade de expor sua escola e captar mais alunos para ${p.ano}!*\n\n${p.obs}${p.rate}\n\n${p.why}\n\n${p.offer}\n\n${p.out}\n\n${sig('pt')}`;}
function escolaMail(l){const p=escolaParts(l);
  return {subject:`Matrículas ${p.ano}: um site para ${p.c}`,
          body:`Olá,\n\nMeu nome é ${p.first}, sou da ${db.settings.company}, empresa brasileira de criação de sites.\n\nNão perca a oportunidade de expor sua escola e captar mais alunos para ${p.ano}!\n\n${p.obs}${p.rate}\n\n${p.why}\n\n${p.offer}\n\n${p.out.replace('dizer "não"','responder "não"')}\n\n${sig('pt')}`};}

/* ---------- mensagens ---------- */
function sig(lang){const s=db.settings;const lp=(lang==='pt'||lang==='es')?lang:'en';
  return `${s.name}\n${s.company}\n${s.site.replace(/\/+$/,'')}/${lp}/`+(s.addr?`\n${s.addr}`:'');}
const WHY={
 pt:{none:'não tem site próprio',facebook:'só tem a página do Facebook',instagram:'só tem o Instagram',linktree:'só tem uma página de links (Linktree)',free:'tem só um site gratuito'},
 es:{none:'no tiene página web propia',facebook:'solo tiene la página de Facebook',instagram:'solo tiene Instagram',linktree:'solo tiene una página de enlaces (Linktree)',free:'solo tiene una web gratuita'},
 it:{none:'non ha un sito web proprio',facebook:'ha solo la pagina Facebook',instagram:'ha solo Instagram',linktree:'ha solo una pagina di link (Linktree)',free:'ha solo un sito gratuito'},
 en:{none:"doesn't have its own website yet",facebook:'only has a Facebook page',instagram:'only has an Instagram page',linktree:'only has a links page (Linktree)',free:'only has a free website'}
};
function wa(l){
  if(langOf(l)==='pt' && l.segment && SEG[l.segment]) return segWA(l);
  const lang=langOf(l),c=l.company,site=l.signal==='site',why=(WHY[lang]||WHY.en)[l.signal];
  const T={
   pt:site?`Olá! Sou da Symbion Labs, uma empresa brasileira de criação de sites. Vi o site da ${c} e gostaria de preparar, sem custo e sem compromisso, um conceito de uma página com um visual mais moderno (feito com IA a partir das informações públicas de vocês) para verem como poderia ficar. Querem que eu envie? (Se não tiverem interesse, é só dizer "não" e eu não escrevo mais.)`
          :`Olá! Sou da Symbion Labs, uma empresa brasileira de criação de sites. Vi que a ${c} ${why}. Posso montar, sem custo e sem compromisso, um rascunho de uma página para você ver como ficaria. Quer que eu envie? (Se não tiver interesse, é só dizer "não" e eu não escrevo mais.)`,
   es:site?`¡Hola! Soy de Symbion Labs, una empresa brasileña de creación de sitios web. Vi la web de ${c} y me gustaría preparar, sin coste y sin compromiso, un concepto de una página con un diseño más moderno (hecho con IA a partir de su información pública) para que vean cómo podría quedar. ¿Quieren que se lo envíe? (Si no les interesa, solo digan «no» y no vuelvo a escribir.)`
          :`¡Hola! Soy de Symbion Labs, una empresa brasileña de creación de sitios web. Vi que ${c} ${why}. Puedo preparar, sin coste y sin compromiso, un borrador de una página para que veas cómo quedaría. ¿Quieres que te lo envíe? (Si no te interesa, solo di «no» y no vuelvo a escribir.)`,
   it:site?`Ciao! Sono di Symbion Labs, un'azienda brasiliana che crea siti web. Ho visto il sito di ${c} e vorrei preparare, gratis e senza impegno, un concept di una pagina con un look più moderno (fatto con l'IA dalle vostre informazioni pubbliche) per mostrarvi come potrebbe essere. Volete che ve lo mandi? (Se non siete interessati, basta dire «no» e non scrivo più.)`
          :`Ciao! Sono di Symbion Labs, un'azienda brasiliana che crea siti web. Ho visto che ${c} ${why}. Posso preparare, gratis e senza impegno, una bozza di una pagina per mostrarti come potrebbe essere. Vuoi che te la mandi? (Se non ti interessa, basta dire «no» e non ti scrivo più.)`,
   en:site?`Hi! I'm with Symbion Labs, a Brazilian web development company. I came across ${c}'s website and I'd be glad to sketch a free one-page concept with a more modern look (made with AI from your public information) so you can see what it could look like. Want me to send it? (If not, just say "no" and I won't message again.)`
          :`Hi! I'm with Symbion Labs, a Brazilian web development company. I noticed ${c} ${why}. I can sketch a free one-page draft for you to look at, no obligation. Want me to send it? (If not, just say "no" and I won't message again.)`
  };
  return (T[lang]||T.en)+'\n\n'+sig(lang);
}
function mail(l){
  if(langOf(l)==='pt' && l.segment && SEG[l.segment]) return segMail(l);
  const lang=langOf(l),c=l.company,site=l.signal==='site',why=(WHY[lang]||WHY.en)[l.signal],city=(l.city||'').split(',')[0],nicho=l.niche||'';
  const T={
   pt:{s:site?`Conceito gratuito de site para ${c}`:`Uma pergunta rápida sobre ${c}`,
       b:(site?`Olá,\n\nSou da Symbion Labs, uma empresa brasileira de criação de sites. Vi o site da ${c}${city?` ao pesquisar negócios em ${city}`:''}. Gostaria de preparar, sem custo e sem compromisso, um conceito de uma página com um visual mais moderno (feito com IA a partir das informações públicas de vocês) para verem o que é possível. Posso enviar?\n\nSe não tiverem interesse, respondam "não" e eu não escrevo mais.\n\n`
              :`Olá,\n\nSou da Symbion Labs, uma empresa brasileira de criação de sites. Vi que a ${c} ${why}. Posso montar, sem custo e sem compromisso, um rascunho de uma página para você ver como ficaria. Posso enviar?\n\nSe não tiver interesse, responda "não" e eu não escrevo mais.\n\n`)},
   es:{s:site?`Borrador gratuito de web para ${c}`:`Una pregunta rápida sobre ${c}`,
       b:(site?`Hola,\n\nSoy de Symbion Labs, un estudio web brasileño. Vi la web de ${c}${city?` mientras buscaba negocios en ${city}`:''}. Me encantaría preparar, sin coste y sin compromiso, un concepto de una página con un diseño más moderno (hecho con IA a partir de su información pública) para que vean lo que es posible. ¿Se lo envío?\n\nSi no les interesa, respondan «no» y no volveré a escribir.\n\n`
              :`Hola,\n\nSoy de Symbion Labs, un estudio web brasileño. Vi que ${c} ${why}. Puedo preparar, sin coste y sin compromiso, un borrador de una página para que vea cómo quedaría. ¿Se lo envío?\n\nSi no le interesa, responda «no» y no volveré a escribir.\n\n`)},
   it:{s:site?`Concept gratuito di sito per ${c}`:`Una domanda veloce su ${c}`,
       b:(site?`Buongiorno,\n\nSono di Symbion Labs, uno studio web brasiliano. Ho visto il sito di ${c}${city?` cercando attività a ${city}`:''}. Vorrei preparare, gratis e senza impegno, un concept di una pagina con un look più moderno (fatto con l'IA dalle vostre informazioni pubbliche) per mostrarvi cosa è possibile. Posso inviarlo?\n\nSe non siete interessati, rispondete «no» e non scriverò più.\n\n`
              :`Buongiorno,\n\nSono di Symbion Labs, uno studio web brasiliano. Ho visto che ${c} ${why}. Posso preparare, gratis e senza impegno, una bozza di una pagina per mostrarvi come potrebbe essere. Posso inviarla?\n\nSe non siete interessati, rispondete «no» e non scriverò più.\n\n`)},
   en:{s:site?`Free website concept for ${c}`:`Quick question about ${c}`,
       b:(site?`Hi there,\n\nI'm with Symbion Labs, a Brazilian web studio. I came across ${c}'s website${nicho&&city?` while looking at ${nicho} businesses in ${city}`:''}. I'd be glad to sketch a free one-page concept of a modernised version (made with AI from your public information) so you can see what's possible, no obligation. Want me to send it?\n\nIf you're not interested, just reply "no" and I won't write again.\n\n`
              :`Hi there,\n\nI'm with Symbion Labs, a Brazilian web studio. I noticed ${c} ${why}. I can sketch a free one-page draft for you to look at, no obligation. Want me to send it?\n\nIf you're not interested, just reply "no" and I won't write again.\n\n`)}
  };
  const t=T[lang]||T.en; return {subject:t.s,body:t.b+sig(lang)};
}

/* ---------- filtros ---------- */
const $ = id => document.getElementById(id);
function fillSelects(){
  const cs=[...new Set(all().map(l=>l.country))].sort();
  $('fCountry').innerHTML='<option value="">Todos os países</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');
  $('fSeg').innerHTML='<option value="">Todos os segmentos</option>'+Object.entries(SEG).filter(([k])=>all().some(l=>l.segment===k)).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  $('fStatus').innerHTML='<option value="">Todos os estados</option>'+Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
}
function passes(l){
  const q=$('q').value.trim().toLowerCase();
  if(q && !(`${l.company} ${l.city} ${l.niche} ${l.country}`.toLowerCase().includes(q))) return false;
  if($('fCountry').value && l.country!==$('fCountry').value) return false;
  if($('fSeg').value && l.segment!==$('fSeg').value) return false;
  const sg=$('fSignal').value;
  if(sg==='none' && l.signal!=='none') return false;
  if(sg==='social' && !socialSig(l.signal)) return false;
  if(sg==='site' && l.signal!=='site') return false;
  const ch=$('fChannel').value;
  if(ch==='mail' && !emailOf(l)) return false;
  if(ch==='nomail' && emailOf(l)) return false;
  if($('fStatus').value && st(l.id).status!==$('fStatus').value) return false;
  return true;
}

/* ---------- render ---------- */
function card(l){
  const s=st(l.id), em=emailOf(l), lang=langOf(l);
  const w=wa(l), m=mail(l);
  const waHref=l.wa?`https://wa.me/${digits(l.wa)}?text=${enc(w)}`:'#';
  const gm=em?`https://mail.google.com/mail/?view=cm&fs=1&to=${enc(em)}&su=${enc(m.subject)}&body=${enc(m.body)}`:'#';
  const ol=em?`https://outlook.live.com/mail/0/deeplink/compose?to=${enc(em)}&subject=${enc(m.subject)}&body=${enc(m.body)}`:'#';
  const q=enc(`${l.company} ${l.city||''} email contacto`);
  const sc=l.signal==='none'?'nosite':socialSig(l.signal)?'social':'site';
  const rate=l.rating!==''&&l.rating!=null?`★ ${l.rating} (${l.reviews})`:'';
  return `<article class="card s-${s.status}" data-id="${l.id}">
   <div class="row"><span class="title">${esc(l.company)}</span>${SEGLABEL(l)?`<span class="chip">${esc(SEGLABEL(l))}</span>`:''}<span class="chip ${sc}">${l.signal==='social'?('só '+esc(l.detail||'rede social')):(SIGLABEL[l.signal]||l.signal)}</span>${rate?`<span class="chip">${rate}</span>`:''}${wasSent(l)?'<span class="chip warn">já enviado antes</span>':''}</div>
   <div class="meta">${esc(l.niche)} · ${esc(l.city)}, ${esc(l.country)} ${l.phone?` · ${esc(l.phone)}`:''}
     ${l.website?` · <a href="${esc(l.website)}" target="_blank" rel="noopener">site</a>`:''}${` · <a href="${esc(mapsOf(l))}" target="_blank" rel="noopener">Maps</a>`}</div>
   <div class="acts">
     <a class="btn wa" href="${waHref}" target="_blank" rel="noopener" ${l.wa?'':'aria-disabled="true"'}>WhatsApp</a>
     <a class="btn g" href="${gm}" target="_blank" rel="noopener" ${em?'':'aria-disabled="true"'}>Gmail</a>
     <a class="btn o" href="${ol}" target="_blank" rel="noopener" ${em?'':'aria-disabled="true"'}>Outlook</a>
     <button class="btn c" data-act="cpwa">Copiar WhatsApp</button>
     <button class="btn c" data-act="cpmail" ${em?'':'disabled'}>Copiar e-mail</button>
     ${em?'':`<a class="btn l" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Buscar e-mail</a>`}
   </div>
   <div class="grid2">
     <label class="f">E-mail (cole aqui quando achar)<input type="email" data-f="email" value="${esc(em)}" placeholder="nome@empresa.com"></label>
     <label class="f">Idioma da mensagem<select data-f="lang">${['pt','es','it','en'].map(x=>`<option value="${x}" ${x===lang?'selected':''}>${{pt:'Português',es:'Español',it:'Italiano',en:'English'}[x]}</option>`).join('')}</select></label>
     <label class="f">Estado<select data-f="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===s.status?'selected':''}>${v}</option>`).join('')}</select></label>
     <label class="f">Anotação<input type="text" data-f="note" value="${esc(s.note)}" placeholder="ex.: respondeu, pediu preço..."></label>
   </div>
   <details><summary>ver mensagens</summary><b>WhatsApp</b><pre>${esc(w)}</pre><b>E-mail</b><pre>${esc('Assunto: '+m.subject+'\n\n'+m.body)}</pre></details>
  </article>`;
}
function render(){
  const ls=all().filter(passes);
  $('list').innerHTML=ls.length?ls.map(card).join(''):'<div class="empty">Nenhum lead com esses filtros.</div>';
  const a=all(); const sent=a.filter(l=>['wa','mail','both','reply','won'].includes(st(l.id).status)).length;
  $('sTotal').textContent=a.length;$('sSent').textContent=sent;
  $('sReply').textContent=a.filter(l=>st(l.id).status==='reply').length;$('sWon').textContent=a.filter(l=>st(l.id).status==='won').length;
}
async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
  if(!ok){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove();}catch(e){}}
  toast(ok?'Copiado!':'Não foi possível copiar: use "ver mensagens".');}

$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const id=b.closest('.card').dataset.id, l=all().find(x=>x.id===id);
  if(b.dataset.act==='cpwa') copy(wa(l));
  if(b.dataset.act==='cpmail'){const m=mail(l);copy(`Para: ${emailOf(l)}\nAssunto: ${m.subject}\n\n${m.body}`);}
});
$('list').addEventListener('change',e=>{
  const f=e.target.dataset.f; if(!f) return;
  const id=e.target.closest('.card').dataset.id; st(id)[f]=e.target.value; save(); setTimeout(render,0);
});
['q','fCountry','fSeg','fSignal','fChannel','fStatus'].forEach(id=>$(id).addEventListener('input',render));

/* ---------- adicionar ---------- */
$('bAdd').onclick=()=>{$('fAdd').reset();$('aWarn').hidden=true;$('dAdd').showModal();};
$('aCancel').onclick=()=>$('dAdd').close();
function checkWarn(){const w=digits($('aWa').value),e=$('aEmail').value.trim().toLowerCase();
  const hit=(w&&SENT.phones.includes(w))||(e&&SENT.emails.includes(e));const el=$('aWarn');el.hidden=!hit;el.textContent=hit?'Atenção: este contato já foi usado nos envios anteriores.':'';return hit;}
['aWa','aEmail'].forEach(id=>$(id).addEventListener('input',checkWarn));
$('fAdd').addEventListener('submit',e=>{
  if(checkWarn() && !confirm('Este contato já foi enviado antes. Adicionar mesmo assim?')){e.preventDefault();return;}
  const n=db.custom.length+1;
  db.custom.push({id:'C'+String(n).padStart(3,'0')+'-'+Date.now().toString(36),company:$('aCompany').value.trim(),niche:$('aNiche').value.trim(),city:$('aCity').value.trim(),country:$('aCountry').value.trim()||'Brasil',segment:$('aSeg').value,detail:'',
    lang:$('aLang').value,phone:$('aWa').value.trim(),wa:digits($('aWa').value),signal:$('aSignal').value,rating:'',reviews:'',website:$('aSite').value.trim(),email:$('aEmail').value.trim(),maps:''});
  save();fillSelects();render();toast('Lead adicionado');
});

/* ---------- assinatura ---------- */
$('bSettings').onclick=()=>{const s=db.settings;$('sName').value=s.name;$('sCompany').value=s.company;$('sSite').value=s.site;$('sAddr').value=s.addr||'';$('dSet').showModal();};
$('sCancel').onclick=()=>$('dSet').close();
$('fSet').addEventListener('submit',()=>{db.settings={name:$('sName').value.trim(),company:$('sCompany').value.trim(),site:$('sSite').value.trim(),addr:$('sAddr').value.trim()};save();render();toast('Assinatura salva');});

/* ---------- exportar / backup ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
$('bExport').onclick=()=>{
  const cols=['empresa','nicho','cidade','pais','telefone','email','site','situacao_site','estado','anotacao'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=all().map(l=>[l.company,l.niche,l.city,l.country,l.phone,emailOf(l),l.website,SIGLABEL[l.signal]||l.signal,STATUS[st(l.id).status],st(l.id).note].map(q).join(','));
  download('symbion-leads.csv','﻿'+cols.join(',')+'\n'+rows.join('\n'),'text/csv');
};
$('bBackup').onclick=()=>download('symbion-backup.json',JSON.stringify(db),'application/json');
$('bRestore').onclick=()=>$('fRestore').click();
$('fRestore').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);db={...db,...p,settings:{...db.settings,...(p.settings||{})}};save();fillSelects();render();toast('Backup restaurado');}catch(err){toast('Arquivo inválido');}};r.readAsText(f);e.target.value='';});

fillSelects();render();
</script>
</body>
</html>
